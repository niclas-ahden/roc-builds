name: Test the action

# Installs a published compiler with this repository's action on every system
# it supports, and runs it.
#
#   gh workflow run test.yml -R niclas-ahden/roc-builds -f commit=<full hash>

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "A roc-lang/roc commit with a published build, its full hash."
        required: true
      # roc-mac is a self-hosted Mac registered with this repository, used while
      # GitHub hands this account no Apple silicon runner. Pass macos-15 to use
      # GitHub's.
      apple-silicon-runner:
        description: "The runner label for the Apple silicon test."
        default: roc-mac
      only:
        description: "Test on this one runner label only, for example ubuntu-24.04."
        default: ""

# Do not add permissions here! Configure them at the job level!
permissions: {}

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.only != '' && format('["{0}"]', inputs.only) || format('["ubuntu-24.04", "ubuntu-24.04-arm", "macos-15-intel", "{0}", "windows-2025"]', inputs.apple-silicon-runner)) }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - id: roc
        uses: ./
        with:
          commit: ${{ inputs.commit }}

      - name: Check the commit and run the compiler
        env:
          WANTED: ${{ inputs.commit }}
          GOT: ${{ steps.roc.outputs.commit }}
        run: |
          set -euo pipefail
          [ "$WANTED" = "$GOT" ] || { echo "asked for $WANTED, got $GOT" >&2; exit 1; }
          roc version
          printf 'expect 1 + 1 == 2\n' > check.roc
          roc test check.roc
